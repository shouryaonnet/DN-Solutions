<h2>Enrollment Form</h2>

<form

#enrollForm="ngForm"

(ngSubmit)="onSubmit(enrollForm)">

<label>

Student Name

</label>

<input

type="text"

name="studentName"

[(ngModel)]="studentName">

<br><br>

<label>

Email

</label>

<input

type="email"

name="studentEmail"

[(ngModel)]="studentEmail">

<br><br>

<label>

Course ID

</label>

<input

type="number"

name="courseId"

[(ngModel)]="courseId">

<br><br>

<label>

Semester

</label>

<select

name="preferredSemester"

[(ngModel)]="preferredSemester">

<option>Odd</option>

<option>Even</option>

</select>

<br><br>

<label>

<input

type="checkbox"

name="agreeToTerms"

[(ngModel)]="agreeToTerms">

I Agree

</label>

<br><br>

<button

type="submit"

[disabled]="enrollForm.invalid">

Submit

</button>

</form>
