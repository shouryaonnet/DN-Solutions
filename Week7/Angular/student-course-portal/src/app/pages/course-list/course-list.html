<div
class="course-card"

[ngClass]="cardClasses"

[ngStyle]="{

'border-left':
course.gradeStatus=='passed'
? '8px solid green'
: course.gradeStatus=='failed'
? '8px solid red'
: '8px solid gray'

}">

<h3>{{course.name}}</h3>

<p>

<strong>Code :</strong>

{{course.code}}

</p>

<p>

<strong>Credits :</strong>

{{course.credits}}

</p>

<div [ngSwitch]="course.gradeStatus">

<p *ngSwitchCase="'passed'">

✅ Passed

</p>

<p *ngSwitchCase="'failed'">

❌ Failed

</p>

<p *ngSwitchDefault>

⏳ Pending

</p>

</div>

<button (click)="toggleDetails()">

{{isExpanded ? 'Hide Details' : 'Show Details'}}

</button>

<button (click)="enroll()">

Enroll

</button>

</div>
